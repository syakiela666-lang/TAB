<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#0F0F23"/>
    </linearGradient>
    <linearGradient id="pick" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4338CA"/>
      <stop offset="100%" stop-color="#22C55E"/>
    </linearGradient>
  </defs>

  <!-- Background fills entire canvas, NO rounded corners -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- Content scaled to ~72% and centered for maskable safe zone -->
  <g transform="translate(256,256) scale(0.72) translate(-256,-256)">
    <!-- Guitar pick shape -->
    <path d="M256 145.408
      C372.736 157.696
       363.008 280.576
       256 391.168
      C148.992 280.576
       139.264 157.696
       256 145.408Z"
      fill="url(#pick)" opacity="0.25" />

    <!-- Tab lines -->
    <line x1="158.72" y1="188.416" x2="353.28" y2="188.416" stroke="#F8FAFC" stroke-width="4.096" stroke-opacity="0.6" />
    <line x1="158.72" y1="215.45" x2="353.28" y2="215.45" stroke="#F8FAFC" stroke-width="4.096" stroke-opacity="0.6" />
    <line x1="158.72" y1="242.483" x2="353.28" y2="242.483" stroke="#F8FAFC" stroke-width="4.096" stroke-opacity="0.6" />
    <line x1="158.72" y1="269.517" x2="353.28" y2="269.517" stroke="#F8FAFC" stroke-width="4.096" stroke-opacity="0.6" />
    <line x1="158.72" y1="296.55" x2="353.28" y2="296.55" stroke="#F8FAFC" stroke-width="4.096" stroke-opacity="0.6" />
    <line x1="158.72" y1="323.584" x2="353.28" y2="323.584" stroke="#F8FAFC" stroke-width="4.096" stroke-opacity="0.6" />

    <!-- Note dots -->
    <circle cx="226.816" cy="215.45" r="11.264" fill="#22C55E" />
    <circle cx="275.456" cy="269.517" r="11.264" fill="#22C55E" />
    <circle cx="246.272" cy="296.55" r="11.264" fill="#22C55E" />

    <!-- Music note icon -->
    <g transform="translate(304.64, 169.984)" fill="#22C55E" opacity="0.9">
      <ellipse cx="0" cy="20.48" rx="15.36" ry="11.264" />
      <rect x="12.8" y="-40.96" width="4.096" height="61.44" />
    </g>
  </g>
</svg>
