<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#0F0F23"/>
    </linearGradient>
    <linearGradient id="pick" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4338CA"/>
      <stop offset="100%" stop-color="#22C55E"/>
    </linearGradient>
  </defs>

  <!-- Background fills entire canvas, NO rounded corners -->
  <rect width="192" height="192" fill="url(#bg)"/>

  <!-- Content scaled to ~80% and centered for maskable safe zone -->
  <g transform="translate(96,96) scale(0.72) translate(-96,-96)">
    <!-- Guitar pick shape -->
    <path d="M96 54.528
      C139.776 59.136
       136.128 105.216
       96 146.688
      C55.872 105.216
       52.224 59.136
       96 54.528Z"
      fill="url(#pick)" opacity="0.25" />

    <!-- Tab lines -->
    <line x1="59.52" y1="70.656" x2="132.48" y2="70.656" stroke="#F8FAFC" stroke-width="1.536" stroke-opacity="0.6" />
    <line x1="59.52" y1="80.794" x2="132.48" y2="80.794" stroke="#F8FAFC" stroke-width="1.536" stroke-opacity="0.6" />
    <line x1="59.52" y1="90.931" x2="132.48" y2="90.931" stroke="#F8FAFC" stroke-width="1.536" stroke-opacity="0.6" />
    <line x1="59.52" y1="101.069" x2="132.48" y2="101.069" stroke="#F8FAFC" stroke-width="1.536" stroke-opacity="0.6" />
    <line x1="59.52" y1="111.206" x2="132.48" y2="111.206" stroke="#F8FAFC" stroke-width="1.536" stroke-opacity="0.6" />
    <line x1="59.52" y1="121.344" x2="132.48" y2="121.344" stroke="#F8FAFC" stroke-width="1.536" stroke-opacity="0.6" />

    <!-- Note dots -->
    <circle cx="85.056" cy="80.794" r="4.224" fill="#22C55E" />
    <circle cx="103.296" cy="101.069" r="4.224" fill="#22C55E" />
    <circle cx="92.352" cy="111.206" r="4.224" fill="#22C55E" />

    <!-- Music note icon -->
    <g transform="translate(114.24, 63.744)" fill="#22C55E" opacity="0.9">
      <ellipse cx="0" cy="7.68" rx="5.76" ry="4.224" />
      <rect x="4.8" y="-15.36" width="1.536" height="23.04" />
    </g>
  </g>
</svg>
